spring:

  application:
    name: TrendyThread

  profiles:
    active: dev

jwt:
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}    # 1 hour
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

security:
  login-rate-limit:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

# OAuth2 login (Google/GitHub) is entirely opt-in and OFF by default.
# Deliberately NOT using Spring Boot's own spring.security.oauth2.client.registration.*
# namespace here — Boot auto-activates its OAuth2 client autoconfiguration the moment
# those keys exist (even with blank values), which would break startup with no
# credentials set. This custom oauth2.* namespace + oauth2.enabled gate
# (see OAuth2ClientRegistrationConfig) keeps the whole feature inert until you opt in.
#
# To enable: create an OAuth app in the Google Cloud Console and/or a GitHub OAuth App
# (redirect URI: http://localhost:8079/login/oauth2/code/google or .../github), then set
# OAUTH2_ENABLED=true plus the client id/secret env vars below.
oauth2:
  enabled: ${OAUTH2_ENABLED:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}