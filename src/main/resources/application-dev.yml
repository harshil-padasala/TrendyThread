server:
  port: 8079

# Logging configuration: root level + package-specific overrides for controllers
logging:
  level:
    root: INFO
    com.trendythread.app: DEBUG
    org:
      springframework:
        security: DEBUG
  file:
    path: logs/trendy-thread.log
    name: trendy-thread.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

spring:

  application:
    name: TrendyThread

  datasource:
    url: jdbc:h2:mem:trendythread
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        id:
          new_generator_mappings: true
        jdbc:
          batch_size: 10
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

